<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML Link Button</title>

	<style>
		a:link, a:visited
		{
			color: darkblue;
			background-color: lightgray;
			text-decoration: none;
			text-align:	center;	
			padding: 15px;
			display: inline-block;
			border-radius: 15px;

		}

		a:hover, a:active
		{
			color: hotpink;
			background-color: blanchedalmond;
			border-radius: 25px;
		}
	</style>

</head>
