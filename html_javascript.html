	<title>HTML Javascripts</title>

<body>

	<h2>Question 1 :Change Content</h2>

	<p id="qatt">Welcome to my page</p>

	<button type="button" onclick='document.getElementById("qatt").innerHTML="I love to learn web design"'>Click Here</button>

	<h2>Question 2: Change Style</h2>
	<p id="IM">Hello! Welcome to Faculty of Information Management</p>

	<script>
		function myStyle()
		{
			document.getElementById("IM").style.fontSize="25px";
			document.getElementById("IM").style.color="blue";
			document.getElementById("IM").style.fontFamily="Courier New";
			document.getElementById("IM").style.backgroundColor="yellow"
		}
	</script>

	<button type="button" onclick="myStyle()">TEKAN SAYA</button>

	<h2>Question 3: Image Manipulation</h2>

	<script>
		function myImage(a)
		{
			var	pict;
			if (a==1)
			{
				pict="image/apple.jpg"
			}
			else 
			{
				pict="image/bitten.jpg"
			}
			document.getElementById('bite').src=pict;
		}

	</script>

	<img src="image/apple.jpg" width="300" height="250" id="bite">
	<p>
		<button type="button" onclick="myImage(1)">Apple</button>
		<button type="button" onclick="myImage(2)">Bitten Apple</button>
	</p>
