<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML Links Exercise</title>
</head>
<body>

	<h2>Five Images</h2>

	<img src="image/moon.png" alt="image of a cat on a moon" height="250" width="350">
	<img src="image/avocado.jpg" alt="image of an animated avocado" height="300" width="350">
	<img src="image/capybara.jpg" alt="image of a capybara floating" height="300" width="350">
	<img src="image/capybara_smiling.png" alt="image of a capybara smilling" height="300" width="350">
	<img src="image/capybara_painting.jpg" alt="image of a painted capybara" height="400" width="350">

	<h2>An Image</h2>

	<img src="image/cat_vangogh.jpg" style=" height: 200px; width: 200px; border: 2px;">

	<h2>Image as Link</h2>

	<a href="https://www.google.com/" target="_blank" title="Google Search Engine"> <img src="image/paw.png" style=" height: 200px; width: 200px;"></a>

	<h2>Links</h2>

	<a href="https://www.bing.com/">Bing Search Engine</a><br>
	<a href="https://yandex.com/">Yandex Search Engine</a><br>
	<a href="https://search.yahoo.com/">Yahoo Search Engine</a><br>
	<a href="https://www.lycos.com/">Lycos Search Engine</a><br>

	<h2>Links Open In New Window</h2>

	<a href="https://www.canva.com/create-new" target="_blank" >Go to Canva</a><br>
	<a href="https://www.wikipedia.org" target="_blank" >Go to Wikipedia</a><br>
	<a href="https://www.youtube.com" target="_blank" >Go to Youtube</a><br>
	<a href="https://www.nationalgeographic.com" target="_blank" >Go to National Geographic</a><br>

</body>
</html>
