<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>HTML Button As Link</title>

	<style>
		a:link, a:visited
		{
			color: lightgray;
			background-color: darkblue;
			text-decoration: none;
			text-align:	center;	
			padding: 15px;
			display: inline-block;
			border-radius: 15px;
		}

		a:active, a:hover 
		{
			color: darkblue;
			background-color: lightgray;
			text-decoration: none;
			text-align:	center;	
			padding: 15px;
			display: inline-block;
			border-radius: 25px;
		}
	</style>
</head>
<body>

	<h2>Links</h2>

	<a href="https://www.w3schools.com/css/default.asp">CSS Tutorial</a><br><br>

	<a href="https://www.w3schools.com/html/default.asp">HTML Tutorial</a>

</body>
</html>
